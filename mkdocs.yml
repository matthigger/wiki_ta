site_name: TA Wiki
site_description: Instructions for course TAs
repo_url: https://github.com/matthigger/wiki_ta

theme:
  name: material
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Instructions:
      - Proctoring: instructions/proctoring.md
      - Scanning quizzes/exams: instructions/scanning.md
      - Study groups: instructions/study_groups.md
      - Grading: instructions/grading.md
